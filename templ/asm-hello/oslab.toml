# 工程清单：一个单文件汇编工程，直接汇编成一张软盘。
#
# asm 工程没有链接这一步，sources / link / kernel 都不读——引导代码和负载就在同一个
# .asm 里，靠 org 0x7C00 落到复位向量跳过来的地址上。
#
# 不认识的键会当场点名报错。
kind = "asm"

# entry 是入口，.asm / .s，路径相对本文件所在目录。
entry = "boot.asm"

# ── 想要第二级？写 stages ───────────────────────────────────────────────
# 0 号扇区只有 512 字节，装不下的东西可以摆到后面的扇区，再用 int 13h 读进去。
# stages 按顺序摆，第一个必须是带 AA55 的 512 字节引导扇区，addr 写它被读进/跳到哪。
# 写了 stages 就不再走单文件那条路，每级各自汇编后按整扇区落盘。
# stages = [
#   { path = "boot.asm", addr = 0x7C00 },
#   { path = "setup.asm", addr = 0x9000 },
# ]

# ── base：把这个文件装到哪，默认 0x7C00 ─────────────────────────────────
# 想换落点就改这里，并把源文件里的 org 改成同一个值：两者不一致会跳到空处。
# 16 字节对齐，允许 0x500–0x7C00。
# base = 0x7C00

# ── 想要真多模块？换成 kind = "c" ───────────────────────────────────────
# 那才有 sources / link / kernel：gcc 编、ld 链，跨文件符号由链接器解。
# asm 工程里只能用 %include 拼文件。

# ── 不能写在这里的 ─────────────────────────────────────────────────────
# [run] 段（按钮文字、入口暂停）现在归工作区根的 settings.toml，留着会报错。
