# 工程清单：一个单文件汇编工程，直接汇编成一张软盘。
#
# asm 工程没有链接这一步，所以 sources / boot / link 都不读——引导代码和内核
# 就在同一个 .asm 里，靠 org 0x7C00 落到复位向量跳过来的地址上。

# kind 只有 "asm" 和 "c" 两种。改成 kind = "c" 时，sources / boot / link
# 就成了必需项。
kind = "asm"

# entry 是入口，必须是 .asm 或 .c，路径相对本文件所在目录。
entry = "boot.asm"

# ── base：把这个文件装到哪，默认 0x7C00 ─────────────────────────────────
# 想换落点就改这里，并把源文件里的 org 改成同一个值：两者不一致会跳到空处。
# 16 字节对齐，允许 0x500–0x7C00。
base = 0x7C00

# ── 想拆成多文件？asm 工程不合并多个源文件 ───────────────────────────────
# 没有链接器，%include "别的文件.asm" 是唯一的多文件办法；要真正的多模块、
# 跨文件符号解析，用 kind = "c" 并在 sources 里列出来。

# ── 512 字节是硬门槛 ───────────────────────────────────────────────────
# 引导扇区只能装 512 字节，最后两个字节必须 AA55。内容多了 nasm 会报
# "times 510-($-$$) db 0" 为负，那就得把东西挪到后面的扇区自己读。

# ── 不能写在这里的 ────────────────────────────────────────────────────
# [run] 段（按钮文字、入口暂停）现在归工作区根的 settings.toml，留着会报错。
