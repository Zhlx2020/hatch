# 工程清单：这个目录怎么构建成一张可启动软盘。
#
# 只写"由哪些文件、按什么地址、怎么链接"。启动开关（按钮文字、模板、附加参数、
# QEMU 参数）不在这里——那些存在工作区根的 settings.toml，从界面改。
# 写完存盘，文件树里这个目录就带上"可运行"的标记；点运行按下面这份说明构建。
#
# 键只有六个：kind / entry / sources / boot / link / base。多写一个不认识的
# 键会当场点名报错，不会静默忽略。

# kind 只有两种：
#   "c"   → gcc 编 .c，ld 按 link 指定的脚本链接，再拼 boot 提供的引导扇区
#   "asm" → nasm 单文件汇编，没有链接这一步，sources / boot / link 一概不读
kind = "c"

# entry 是入口，必须是 .c 或 .asm，路径相对本文件所在目录。
# C 工程里它就是 _start 所在的文件，也必须出现在 sources 里。
entry = "src/kmain.c"

# sources 是全部参与链接的 .c（.h 不用写，靠 -I 找）。不写就只编 entry 一个，
# 于是任何跨文件调用都会报未定义符号。顺序无所谓，entry 必须在里面。
sources = [
  "src/kmain.c",
  "src/screen.c",
  "src/keyboard.c",
]

# boot 是引导扇区源文件（.asm，nasm 编）。它必须正好 512 字节、以 AA55 结尾、
# 把内核读进来并跳过去。仓库里这份就是可用的写法：一次 int 13h 读 32 扇区到
# 0x10000，开 A20，进保护模式。改它之前先读它的注释——它和 src 里的内核配套。
boot = "boot/boot.asm"

# link 是链接脚本。内核钉在 0x10000，引导扇区最多载 31 扇区（15,872 字节），
# 超过在构建期就被挡下。
link = "boot/kernel.ld"

# 只跑一个 .c 试试：把 sources 整行删掉，只留 entry。

# ── base：引导扇区装到哪，默认 0x7C00 ───────────────────────────────────
# 只有想换引导扇区的落点时才写（同时要把 boot 里那行的 org 改成一样的值），
# 16 字节对齐，允许 0x500–0x7C00。内核地址固定 0x10000，这里动不了它。
# base = 0x7C00

# ── 想写 asm 工程？整个文件换成这四行就够 ───────────────────────────────
# kind = "asm"
# entry = "boot.asm"
# base = 0x7C00

# ── 加文件 / 换入口 ────────────────────────────────────────────────────
# 加源文件：往 sources 里加一行，文件放进 src/。
# 换入口：改 entry，确认新文件在 sources 里、里面有 _start。

# ── 不能写在这里的 ────────────────────────────────────────────────────
# [run] 段：以前放过 label / pause_at_entry，现在归 settings.toml，留着会报错。
# 编译选项：-m32 / -ffreestanding / -O0 / -g 是固定的，改不了。
