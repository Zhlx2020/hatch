<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>OS Lab</title>
<link rel="stylesheet" href="/ui/styles/base.css" />
<link rel="stylesheet" href="/ui/styles/layout.css" />
<link rel="stylesheet" href="/ui/styles/panels.css" />
<link rel="stylesheet" href="/ui/styles/detail.css" />
<script>
  window.__err = "";
  window.addEventListener("error", (e) => { window.__err += e.message + " @ " + e.filename + ":" + e.lineno + "\n"; });
  window.addEventListener("unhandledrejection", (e) => { window.__err += "REJ " + e.reason + "\n"; });
</script>
</head>
<body>
<header>
  <span class="title">OS LAB</span>
  <div id="run-group">
    <button id="run" class="primary">运行</button>
    <button id="run-more" class="primary" title="更多启动方式">▾</button>
    <div id="run-menu">
      <button data-act="run">构建并运行</button>
      <button data-act="build">只构建</button>
      <button data-act="reset">软复位（回复位向量）</button>
      <button data-act="reboot">重新构建并启动</button>
      <button data-act="settings">启动设置…</button>
    </div>
  </div>
  <button id="pause">暂停</button>
  <button id="cont">继续</button>
  <button id="step">单步</button>
  <button id="step-over">越过</button>
  <button id="reset">复位</button>
  <button id="gear" class="mini" title="设置">设置</button>
  <span id="status">待机</span>
</header>

<section id="files" class="pane">
  <h2>文件 <button id="new-file" class="mini">＋</button><button id="new-dir" class="mini">＋目录</button><button id="del-file" class="mini">－</button></h2>
  <div class="body" id="tree"></div>
  <div id="tree-menu"></div>
</section>

<section id="editor" class="pane">
  <h2><span id="file-title">—</span></h2>
  <div class="body" id="editor-body"><div id="editor-host"></div><div id="problems"></div></div>
</section>

<aside>
  <div id="screenwrap"><canvas id="screen" width="720" height="400" tabindex="0"></canvas><div id="screen-hint" class="open"><span class="spin"></span><span class="word">待机，点「运行」启动</span></div>
      <pre id="serial-view" hidden></pre></div>
  <div id="panels">
    <section class="pane"><h2><span>寄存器</span><span class="tag">断点</span><button class="mini more" data-open="regs">展开</button></h2><div class="body"><div id="regs" class="rgrid"></div><div id="bps" class="bps"></div></div></section>
    <section class="pane"><h2><span>反汇编</span><button class="mini more" data-open="dis">展开</button></h2><div class="body"><div id="disasm" class="drows"></div></div></section>
    <section class="pane"><h2><span>内存</span><button class="mini more" data-open="mem">展开</button></h2><div class="body"><div id="mem" class="mrows"></div></div></section>
  </div>
</aside>

<div id="templates">
  <div id="templates-head">
    <span>从模板新建</span>
    <span class="grow"></span>
    <button id="templates-close">关闭</button>
  </div>
  <div id="templates-body"></div>
</div>

<div id="settings">
  <div id="settings-tabs">
    <button data-tab="run">启动按钮</button>
    <button data-tab="qemu">QEMU</button>
    <span class="grow"></span>
    <button id="settings-close">关闭</button>
  </div>
  <div id="settings-body"></div>
  <div id="settings-foot">
    <span id="settings-note">改完重启会话后生效</span>
    <span class="grow"></span>
    <button id="settings-reset" class="extra">恢复默认</button>
    <button id="settings-save" class="primary">保存</button>
  </div>
</div>

<div id="detail">
  <div id="detail-tabs">
    <button data-tab="regs">寄存器</button>
    <button data-tab="mem">内存</button>
    <button data-tab="dis">反汇编</button>
    <span class="grow"></span>
    <button id="detail-close">关闭</button>
  </div>
  <div id="detail-body"></div>
</div>

<script type="module" src="/ui/js/boot.js"></script>
</body>
</html>
